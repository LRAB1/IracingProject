<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iRacing Setup Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>iRacing Setup Manager</h1>
        </header>
        
        <nav>
            <button onclick="showView('add')" class="nav-btn">Add Setup</button>
            <button onclick="showView('import')" class="nav-btn">Import Setups</button>
            <button onclick="showView('list')" class="nav-btn">View Setups</button>
            <button onclick="showView('average')" class="nav-btn">Average Setups</button>
        </nav>
        
        <!-- Add Setup View -->
        <div id="add-view" class="view active">
            <h2>Add New Setup</h2>
            <form id="setup-form">
                <div class="form-section">
                    <h3>General Information</h3>
                    <div class="form-group">
                        <label for="car">Car:</label>

                                <option value="Dallara IR-18">Dallara IR-18</option>
                                <option value="Formula Vee">Formula Vee</option>
                                <option value="Ray FF1600">Ray FF1600</option>
                                <option value="Super Formula Lights">Super Formula Lights</option>
                                <option value="Super Formula SF23">Super Formula SF23</option>
                            </optgroup>
                            <optgroup label="Sports Cars">
                                <option value="Mazda MX-5">Mazda MX-5 Cup</option>
                                <option value="Global Mazda MX-5">Global Mazda MX-5</option>

                                <option value="Radical SR8">Radical SR8</option>
                                <option value="Radical SR10">Radical SR10</option>
                            </optgroup>
                            <optgroup label="GT3 Cars">
                                <option value="Audi R8 LMS GT3">Audi R8 LMS GT3</option>
                                <option value="BMW M4 GT3">BMW M4 GT3</option>
                                <option value="Ferrari 296 GT3">Ferrari 296 GT3</option>
                                <option value="Ferrari 488 GT3 Evo">Ferrari 488 GT3 Evo</option>
                                <option value="Ford Mustang GT3">Ford Mustang GT3</option>
                                <option value="Lamborghini Huracan GT3 EVO">Lamborghini Huracan GT3 EVO</option>
                                <option value="McLaren 720S GT3">McLaren 720S GT3</option>
                                <option value="Mercedes-AMG GT3">Mercedes-AMG GT3</option>
                                <option value="Porsche 911 GT3 R">Porsche 911 GT3 R (992)</option>
                            </optgroup>
                            <optgroup label="GT4 Cars">
                                <option value="Aston Martin Vantage GT4">Aston Martin Vantage GT4</option>

                                <option value="Donington Park">Donington Park</option>

                                <option value="Le Mans">Circuit de la Sarthe</option>
                                <option value="Monza">Autodromo Nazionale Monza</option>
                                <option value="Nürburgring">Nürburgring Grand-Prix-Strecke</option>

                                <option value="Oulton Park">Oulton Park</option>

                                <option value="Snetterton">Snetterton Circuit</option>

                            </optgroup>
                            <optgroup label="Road - Asia &amp; Australia">

                                <option value="Okayama">Okayama International Circuit</option>

                                <option value="Kentucky Speedway">Kentucky Speedway</option>
                                <option value="Las Vegas Motor Speedway">Las Vegas Motor Speedway</option>
                                <option value="Michigan International Speedway">Michigan International Speedway</option>
                                <option value="Phoenix Raceway">Phoenix Raceway</option>

                                <option value="Bristol Motor Speedway - Dirt">Bristol Motor Speedway - Dirt</option>
                                <option value="Eldora Speedway">Eldora Speedway</option>

                                <option value="Rallycross - Daytona">Rallycross - Daytona</option>
                                <option value="Rallycross - Hell">Rallycross - Hell</option>
                                <option value="Rallycross - Lånkebanen">Rallycross - Lånkebanen</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="setupName">Setup Name:</label>
                        <input type="text" id="setupName" name="setupName" required>
                    </div>
                    <div class="form-group">
                        <label for="tireType">Tire Type:</label>
                        <select id="tireType" name="tireType" required>
                            <option value="dry">Dry</option>
                            <option value="wet">Wet</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-section">
                    <h3>General Setup</h3>
                    <div class="form-group">
                        <label for="fuelLevel">Fuel Level (liters):</label>
                        <input type="number" step="0.1" id="fuelLevel" name="fuelLevel" value="0">
                    </div>
                    <div class="form-group">
                        <label for="frontToe">Front Toe (mm):</label>
                        <input type="number" step="0.1" id="frontToe" name="frontToe" value="0">
                    </div>
                    <div class="form-group">
                        <label for="frontARB">Front ARB (-1=soft, 0=med, 1=hard):</label>
                        <input type="number" id="frontARB" name="frontARB" value="0">
                    </div>
                    <div class="form-group">
                        <label for="rearToe">Rear Toe (mm):</label>
                        <input type="number" step="0.1" id="rearToe" name="rearToe" value="0">
                    </div>
                    <div class="form-group">
                        <label for="rearARB">Rear ARB (-1=soft, 0=med, 1=hard):</label>
                        <input type="number" id="rearARB" name="rearARB" value="0">
                    </div>
                </div>
                
                <div class="form-section">
                    <h3>Left Front</h3>
                    <div class="form-group">
                        <label for="LF_Pressure">Pressure (PSI):</label>
                        <input type="number" step="0.1" id="LF_Pressure" name="LF_Pressure" value="0">
                    </div>
                    <div class="form-group">
                        <label for="LF_SpringPerchOffset">Spring Perch Offset (mm):</label>
                        <input type="number" step="0.1" id="LF_SpringPerchOffset" name="LF_SpringPerchOffset" value="0">
                    </div>
                    <div class="form-group">
                        <label for="LF_BumpStiffness">Bump Stiffness (clicks):</label>
                        <input type="number" step="0.1" id="LF_BumpStiffness" name="LF_BumpStiffness" value="0">
                    </div>
                    <div class="form-group">
                        <label for="LF_ReboundStiffness">Rebound Stiffness (clicks):</label>
                        <input type="number" step="0.1" id="LF_ReboundStiffness" name="LF_ReboundStiffness" value="0">
                    </div>
                    <div class="form-group">
                        <label for="LF_Camber">Camber (degrees):</label>
                        <input type="number" step="0.1" id="LF_Camber" name="LF_Camber" value="0">
                    </div>
                </div>
                
                <div class="form-section">
                    <h3>Right Front</h3>
                    <div class="form-group">
                        <label for="RF_Pressure">Pressure (PSI):</label>
                        <input type="number" step="0.1" id="RF_Pressure" name="RF_Pressure" value="0">
                    </div>
                    <div class="form-group">
                        <label for="RF_SpringPerch">Spring Perch (mm):</label>
                        <input type="number" step="0.1" id="RF_SpringPerch" name="RF_SpringPerch" value="0">
                    </div>
                    <div class="form-group">
                        <label for="RF_BumpStiffness">Bump Stiffness (clicks):</label>
                        <input type="number" step="0.1" id="RF_BumpStiffness" name="RF_BumpStiffness" value="0">
                    </div>
                    <div class="form-group">
                        <label for="RF_ReboundStiffness">Rebound Stiffness (clicks):</label>
                        <input type="number" step="0.1" id="RF_ReboundStiffness" name="RF_ReboundStiffness" value="0">
                    </div>
                    <div class="form-group">
                        <label for="RF_Camber">Camber (degrees):</label>

                        <label for="RR_Pressure">Pressure (PSI):</label>
                        <input type="number" step="0.1" id="RR_Pressure" name="RR_Pressure" value="0">
                    </div>

                        <label for="RR_SpringPerch">Spring Perch (mm):</label>
                        <input type="number" step="0.1" id="RR_SpringPerch" name="RR_SpringPerch" value="0">
                    </div>
                    <div class="form-group">
                        <label for="RR_BumpStiffness">Bump Stiffness (clicks):</label>
                        <input type="number" step="0.1" id="RR_BumpStiffness" name="RR_BumpStiffness" value="0">

                    <div class="form-group">
                        <label for="RR_ReboundStiffness">Rebound Stiffness (clicks):</label>
                        <input type="number" step="0.1" id="RR_ReboundStiffness" name="RR_ReboundStiffness" value="0">
                    </div>
                    <div class="form-group">
                        <label for="RR_Camber">Camber (degrees):</label>
                        <input type="number" step="0.1" id="RR_Camber" name="RR_Camber" value="0">
                    </div>
                </div>
                
                <div class="form-section">
                    <h3>Left Rear</h3>
                    <div class="form-group">
                        <label for="LR_Pressure">Pressure (PSI):</label>
                        <input type="number" step="0.1" id="LR_Pressure" name="LR_Pressure" value="0">
                    </div>
                    <div class="form-group">
                        <label for="LR_SpringPerch">Spring Perch (mm):</label>
                        <input type="number" step="0.1" id="LR_SpringPerch" name="LR_SpringPerch" value="0">
                    </div>
                    <div class="form-group">
                        <label for="LR_BumpStiffness">Bump Stiffness (clicks):</label>
                        <input type="number" step="0.1" id="LR_BumpStiffness" name="LR_BumpStiffness" value="0">
                    </div>
                    <div class="form-group">
                        <label for="LR_ReboundStiffness">Rebound Stiffness (clicks):</label>
                        <input type="number" step="0.1" id="LR_ReboundStiffness" name="LR_ReboundStiffness" value="0">
                    </div>
                    <div class="form-group">
                        <label for="LR_Camber">Camber (degrees):</label>
                        <input type="number" step="0.1" id="LR_Camber" name="LR_Camber" value="0">
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Save Setup</button>
            </form>
            <div id="add-message" class="message"></div>
        </div>
        
        <!-- Import Setups View -->
        <div id="import-view" class="view">
            <h2>Import Setups from Files</h2>
            <div class="form-section">
                <p>Select iRacing setup files (.sto) to import. The system will ask for confirmation before saving.</p>
                <div class="form-group">
                    <label for="setup-files">Choose Setup Files:</label>
                    <input type="file" id="setup-files" accept=".sto" multiple>
                </div>
                <button onclick="importSetups()" class="btn-primary">Import Selected Files</button>
            </div>
            <div id="import-message" class="message"></div>
            <div id="import-results"></div>
        </div>
        
        <!-- List Setups View -->
        <div id="list-view" class="view">
            <h2>Saved Setups</h2>
            <div class="form-section">
                <div class="form-group">
                    <label for="filter-tire-type">Filter by Tire Type:</label>
                    <select id="filter-tire-type" onchange="loadSetups()">
                        <option value="all">All</option>
                        <option value="dry">Dry</option>
                        <option value="wet">Wet</option>
                    </select>
                </div>
            </div>
            <div id="setups-list"></div>
        </div>
